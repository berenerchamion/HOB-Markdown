name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write      # Required to deploy to GitHub Pages
  id-token: write   # Required for secure OIDC authentication by GitHub Pages

# If you push again while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter's Linux desktop build needs these system packages.
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev lcov

      - run: flutter --version

      - run: flutter pub get

      # The analyzer result doesn't depend on the OS, so run it once.
      - name: Analyze
        if: matrix.target == 'linux'
        run: flutter analyze

      # --- COVERAGE PIPELINE FOR LINUX ---
      - name: Activate Flutter coverage package (Linux)
        if: matrix.target == 'linux'
        run: flutter pub global activate coverage

      - name: Run tests with Function Coverage (Linux)
        if: matrix.target == 'linux'
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          flutter pub global run coverage:test_with_coverage --function-coverage --branch-coverage

      - name: Filter out auto-generated files (Linux)
        if: matrix.target == 'linux'
        run: |
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/generated_plugin_registrant.dart' \
            -o coverage/lcov.cleaned.info

      - name: Generate HTML Report via genhtml (Linux)
        if: matrix.target == 'linux'
        run: |
          genhtml coverage/lcov.cleaned.info -o coverage/html --rc lcov_function_coverage=1

      # Replaces upload-artifact to bundle the site specifically for GitHub Pages deployment
      - name: Upload Pages Artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/html/
      # -----------------------------------

      # Standard test backup step for non-Linux runners
      - name: Run standard tests (macOS and Windows)
        if: matrix.target != 'linux'
        run: flutter test

      - name: Build (release)
        run: flutter build ${{ matrix.target }} --release

  # Pages deployment step that runs after the builds complete successfully
  deploy:
    name: Deploy Coverage Dashboard
    needs: build
    # Only deploy when code is merged into main/develop, not during pull requests
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
