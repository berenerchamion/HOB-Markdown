name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch: # lets you run it manually from the Actions tab

# Least privilege by default. The deploy job at the bottom asks for the extra
# permissions it needs, so the build jobs (which run on every pull request)
# never hold them.
permissions:
  contents: read

# If you push again while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # stops a hung build from burning runner minutes
    strategy:
      # Let every platform finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter's Linux desktop build needs these system packages; lcov is for
      # the coverage report.
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev lcov

      - run: flutter --version

      - run: flutter pub get

      # The analyzer result doesn't depend on the OS, so run it once.
      - name: Analyze
        if: matrix.target == 'linux'
        run: flutter analyze

      # --- Coverage (Linux only) ---------------------------------------------
      # `flutter test --coverage` writes coverage/lcov.info by itself; the
      # separate `coverage` package is not needed.
      #
      # Branch coverage is deliberately NOT enabled. Dart can report a branch on
      # a line that has no line-coverage entry, and lcov/genhtml 2.x reject that
      # (lcov calls it "inconsistent", genhtml calls it "category"). Line
      # coverage is all the badge needs.
      - name: Run tests with coverage (Linux)
        if: matrix.target == 'linux'
        run: flutter test --coverage --branch-coverage

      - name: Filter generated files out of coverage (Linux)
        if: matrix.target == 'linux'
        run: |
          lcov --branch-coverage --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/generated_plugin_registrant.dart' \
            --output-file coverage/lcov.cleaned.info \
            --ignore-errors unused,inconsistent,empty

      - name: Generate HTML coverage report (Linux)
        if: matrix.target == 'linux'
        run: |
          genhtml coverage/lcov.cleaned.info \
            --output-directory coverage/html \
            --branch-coverage \
            --ignore-errors inconsistent \
            --title "HOB Markdown test coverage"

      # Writes the total line-coverage percentage to the run summary, and to a
      # small JSON file that shields.io turns into the README badge. The file
      # lives inside the report, so it is published with it.
      - name: Coverage summary and badge data (Linux)
        if: matrix.target == 'linux'
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "%.0f", 100*lh/lf; else print 0 }' coverage/lcov.cleaned.info)
          if   [ "$PCT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 60 ]; then COLOR=yellow
          else COLOR=red
          fi
          echo "Line coverage: ${PCT}%"
          echo "### Test coverage: ${PCT}% of lines" >> "$GITHUB_STEP_SUMMARY"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > coverage/html/coverage.json

      # Downloadable from the run page on every branch and pull request.
      - name: Upload coverage report (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 14

      # Only main publishes the public dashboard.
      - name: Upload Pages artifact (Linux, main only)
        if: matrix.target == 'linux' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage/html/
      # -----------------------------------------------------------------------

      - name: Run tests (macOS and Windows)
        if: matrix.target != 'linux'
        run: flutter test

      - name: Build (release)
        run: flutter build ${{ matrix.target }} --release

  deploy:
    name: Publish coverage report
    needs: build
    # Only publish after a push (or manual run) on main, never for pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment comes from this workflow
    # Never run two Pages deployments at once, and don't cancel one midway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
