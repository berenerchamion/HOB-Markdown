name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: read

# If you push again while a run is in progress, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter's Linux desktop build needs these system packages. If the Linux
      # job fails on a missing library, the error names it: add it to this line.
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - run: flutter --version

      - run: flutter pub get

      # The analyzer result doesn't depend on the OS, so run it once.
      - name: Analyze
        if: matrix.target == 'linux'
        run: flutter analyze

      - run: flutter test

      - name: Build (release)
        run: flutter build ${{ matrix.target }} --release
